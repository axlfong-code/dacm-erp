<section class="auth-page">
  <form id="login-form" class="login-card" novalidate>
    <div class="brand-mark" aria-hidden="true">D</div>
    <p class="eyebrow">DOKTER AC MOBIL</p>
    <h1>DACM ERP</h1>
    <p class="muted">Masuk untuk mengelola operasional bengkel.</p>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required placeholder="Masukkan username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Masukkan password">
    <p id="login-status" class="form-status" role="alert"></p>
    <button id="login-button" class="button primary full" type="submit">Masuk</button>
  </form>
</section>
