<script>
  (function () {
    var app = document.getElementById('app');
    var SESSION_KEY = 'dacm-erp-user';
    var LOCKED_VIEWPORT = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';

    function lockMobileViewport() {
      var viewport = document.querySelector('meta[name="viewport"]');
      if (viewport) viewport.setAttribute('content', LOCKED_VIEWPORT);
      document.documentElement.style.webkitTextSizeAdjust = '100%';
      document.documentElement.style.textSizeAdjust = '100%';
    }

    lockMobileViewport();
    document.addEventListener('focusin', function (event) {
      var tag = event.target && event.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
        lockMobileViewport();
        setTimeout(lockMobileViewport, 250);
      }
    });

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, function (c) {
        return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[c];
      });
    }

    function failure(error) {
      alert((error && error.message) || error || 'Terjadi kesalahan.');
    }

    function formData(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function rupiah(value) {
      return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', maximumFractionDigits:0 }).format(Number(value || 0));
    }

    function cleanNumber(value) {
      return String(value || '').replace(/[^\d]/g, '');
    }

    function formatThousands(value) {
      var raw = cleanNumber(value);
      return raw ? raw.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function todayValue() {
      var day = new Date();
      return day.getFullYear() + '-' + String(day.getMonth() + 1).padStart(2, '0') + '-' + String(day.getDate()).padStart(2, '0');
    }

    function bindLogin() {
      var form = document.getElementById('login-form');
      if (!form) return;
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var button = document.getElementById('login-button');
        button.disabled = true;
        button.textContent = 'Memeriksa...';
        document.getElementById('login-status').textContent = '';
        google.script.run.withSuccessHandler(function (result) {
          button.disabled = false;
          button.textContent = 'Masuk';
          if (result.success) {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(result));
            showDashboard(result);
          }
          else document.getElementById('login-status').textContent = result.message;
        }).withFailureHandler(function (error) {
          button.disabled = false;
          button.textContent = 'Masuk';
          document.getElementById('login-status').textContent = error.message || error;
        }).login(document.getElementById('username').value, document.getElementById('password').value);
      });
    }

    function showLogin() {
      google.script.run.withSuccessHandler(function (html) {
        app.innerHTML = html;
        bindLogin();
      }).withFailureHandler(failure).renderLogin();
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      showLogin();
    }

    function showDashboard(user) {
      google.script.run.withSuccessHandler(function (html) {
        app.innerHTML = html;
        bindDashboard(user);
      }).withFailureHandler(failure).renderDashboard();
    }

    function bindDashboard(user) {
      document.getElementById('user-name').textContent = user.nama || 'User';
      document.getElementById('user-role').textContent = user.role || '';
      document.getElementById('welcome-name').textContent = user.nama || 'User';
      document.getElementById('user-initial').textContent = (user.nama || 'U').charAt(0).toUpperCase();
      document.getElementById('logout-button').addEventListener('click', logout);
      document.getElementById('menu-toggle').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('open');
      });
      document.addEventListener('click', dashboardClick);
      document.addEventListener('input', dashboardInput);
      document.addEventListener('change', dashboardInput);
      loadDashboard();
    }

    function closeDateFilterPopovers(exceptTarget) {
      Array.prototype.forEach.call(document.querySelectorAll('.date-filter-popover'), function (popover) {
        var wrap = popover.closest('.date-filter-wrap');
        if (wrap && exceptTarget && wrap.contains(exceptTarget)) return;
        popover.hidden = true;
      });
    }

    function dashboardClick(event) {
      closeDateFilterPopovers(event.target);
      var customerCloseTarget = event.target.closest('[data-customer-close-form]');
      if (customerCloseTarget) { closeCustomerFormTab(); return; }
      var vehicleCloseTarget = event.target.closest('[data-vehicle-close-form]');
      if (vehicleCloseTarget) { closeVehicleFormTab(); return; }
      var invoiceCloseTarget = event.target.closest('[data-invoice-close-form]');
      if (invoiceCloseTarget) { closeInvoiceFormTab(); return; }
      var closeTarget = event.target.closest('[data-wo-close-form]');
      if (closeTarget) { closeWorkOrderFormTab(closeTarget.getAttribute('data-wo-close-form')); return; }
      var target = event.target.closest('button');
      if (!target) return;
      var view = target.getAttribute('data-view');
      if (view) { openView(view); return; }
      if (target.hasAttribute('data-customer-tab')) { showCustomerTab(target.getAttribute('data-customer-tab')); return; }
      if (target.hasAttribute('data-cancel') && target.closest('#customers-view')) { closeCustomerFormTab(); return; }
      if (target.hasAttribute('data-vehicle-tab')) { showVehicleTab(target.getAttribute('data-vehicle-tab')); return; }
      if (target.hasAttribute('data-cancel') && target.closest('#vehicles-view')) { closeVehicleFormTab(); return; }
      if (target.hasAttribute('data-invoice-tab')) { showInvoiceTab(target.getAttribute('data-invoice-tab')); return; }
      if (target.hasAttribute('data-cancel') && target.closest('#invoice-view')) { closeInvoiceFormTab(); return; }
      if (target.hasAttribute('data-item-tab')) { showItemTab(target.getAttribute('data-item-tab')); return; }
      if (target.hasAttribute('data-item-close-form')) { closeItemFormTab(); return; }
      if (target.hasAttribute('data-cancel') && target.closest('#items-view')) { closeItemFormTab(); return; }
      if (target.hasAttribute('data-wo-tab')) { showWorkOrderTab(currentWorkOrderMode(), target.getAttribute('data-wo-tab')); return; }
      if (target.hasAttribute('data-cancel') && target.closest('.wo-workspace')) { closeWorkOrderFormTab(currentWorkOrderMode()); return; }
      if (target.id === 'customer-new') { editCustomer({}); return; }
      if (target.id === 'customer-refresh') { loadCustomers(); return; }
      if (target.id === 'vehicle-new') { editVehicle({}); return; }
      if (target.id === 'vehicle-refresh') { loadVehicles(); return; }
      if (target.id === 'workorder-new-dashboard') { openView('workorder'); editWorkOrder(); return; }
      if (target.id === 'workorder-new') { editWorkOrder(); return; }
      if (target.id === 'wofast-save') { saveFastWorkOrder(); return; }
      if (target.id === 'wofast-reset') { renderFastWorkOrder(); return; }
      if (target.id === 'workorder-date-filter-button') { toggleWorkOrderDateFilter(); return; }
      if (target.id === 'workorder-date-clear') { clearWorkOrderDateFilter(); return; }
      if (target.id === 'workorder-date-apply') { applyWorkOrderDateFilter(); return; }
      if (target.hasAttribute('data-workorder-refresh')) { loadWorkOrders(target.getAttribute('data-workorder-refresh')); return; }
      if (target.id === 'invoice-new') { editInvoice(); return; }
      if (target.id === 'invoice-refresh') { loadInvoices(); return; }
      if (target.id === 'invoice-date-filter-button') { toggleInvoiceDateFilter(); return; }
      if (target.id === 'invoice-date-clear') { clearInvoiceDateFilter(); return; }
      if (target.id === 'invoice-date-apply') { applyInvoiceDateFilter(); return; }
      if (target.id === 'payment-new') { editPayment(); return; }
      if (target.id === 'item-new') { editItem({}); return; }
      if (target.id === 'item-refresh') { loadItems(); return; }
      if (target.id === 'stock-adjust') { adjustStock(); return; }
      if (target.id === 'supplier-new') { editSupplier({}); return; }
      if (target.id === 'purchase-new') { editPurchase(); return; }
      if (target.id === 'ai-chat-send') { sendAiChatMessage(); return; }
      if (target.hasAttribute('data-ai-execute')) { executeAiAction(target.getAttribute('data-ai-execute'), target); return; }
      if (target.hasAttribute('data-customer-delete')) { deleteCustomer(target.getAttribute('data-customer-delete')); return; }
      if (target.hasAttribute('data-customer')) { google.script.run.withSuccessHandler(editCustomer).withFailureHandler(failure).customerGet(target.getAttribute('data-customer')); return; }
      if (target.hasAttribute('data-vehicle-delete')) { deleteVehicle(target.getAttribute('data-vehicle-delete')); return; }
      if (target.hasAttribute('data-vehicle')) { google.script.run.withSuccessHandler(editVehicle).withFailureHandler(failure).vehicleGet(target.getAttribute('data-vehicle')); return; }
      if (target.hasAttribute('data-workorder')) { google.script.run.withSuccessHandler(editWorkOrder).withFailureHandler(failure).workOrderGet(target.getAttribute('data-workorder')); return; }
      if (target.hasAttribute('data-wo-new-customer')) { createCustomerFromWorkOrder(); return; }
      if (target.hasAttribute('data-wofast-new-customer')) { createFastCustomer(); return; }
      if (target.hasAttribute('data-wo-new-vehicle')) { createVehicleFromWorkOrder(); return; }
      if (target.hasAttribute('data-wofast-new-vehicle')) { createFastVehicle(); return; }
      if (target.hasAttribute('data-workorder-pending')) { changeWorkOrderStatus(target.getAttribute('data-workorder-pending'), 'pending'); return; }
      if (target.hasAttribute('data-workorder-proceed')) { changeWorkOrderStatus(target.getAttribute('data-workorder-proceed'), 'proceed'); return; }
      if (target.hasAttribute('data-workorder-finish')) { finishWorkOrder(target.getAttribute('data-workorder-finish')); return; }
      if (target.hasAttribute('data-workorder-cancel')) { cancelWorkOrder(target.getAttribute('data-workorder-cancel')); return; }
      if (target.hasAttribute('data-workorder-delete')) { deleteWorkOrder(target.getAttribute('data-workorder-delete')); return; }
      if (target.hasAttribute('data-workorder-preset')) { appendWorkOrderPreset(target.getAttribute('data-workorder-preset')); return; }
      if (target.hasAttribute('data-invoice-workorder')) { editInvoice(target.getAttribute('data-invoice-workorder')); return; }
      if (target.hasAttribute('data-invoice-delete')) { deleteInvoice(target.getAttribute('data-invoice-delete')); return; }
      if (target.hasAttribute('data-payment-invoice')) { editPayment(target.getAttribute('data-payment-invoice')); return; }
      if (target.hasAttribute('data-payment-delete')) { deletePayment(target.getAttribute('data-payment-delete')); return; }
      if (target.hasAttribute('data-item')) { google.script.run.withSuccessHandler(editItem).withFailureHandler(failure).itemGet(target.getAttribute('data-item')); return; }
      if (target.hasAttribute('data-supplier')) { google.script.run.withSuccessHandler(editSupplier).withFailureHandler(failure).supplierGet(target.getAttribute('data-supplier')); return; }
      if (target.hasAttribute('data-cancel')) { target.closest('.record-form').parentElement.hidden = true; }
    }

    function dashboardInput(event) {
      if (event.target.id === 'customer-search') loadCustomers();
      if (event.target.id === 'customer-nonactive-filter' || event.target.id === 'customer-category-filter') loadCustomers();
      if (event.target.id === 'vehicle-search') loadVehicles();
      if (event.target.id === 'vehicle-customer-filter' || event.target.id === 'vehicle-brand-filter') loadVehicles();
      if (event.target.id === 'workorder-active-search' || event.target.id === 'workorder-active-status') loadWorkOrders('active');
      if (event.target.id === 'workorder-search' || event.target.id === 'workorder-status' || event.target.id === 'workorder-customer-filter') loadWorkOrders('list');
      if (event.target.hasAttribute && event.target.hasAttribute('data-fast-price')) event.target.value = formatThousands(event.target.value);
      if (event.target.hasAttribute && event.target.hasAttribute('data-fast-check') && event.target.checked) {
        var fastLine = event.target.closest('[data-fast-line]');
        var fastPrice = fastLine && fastLine.querySelector('[data-fast-price]');
        if (fastPrice) setTimeout(function () { fastPrice.focus(); fastPrice.select(); }, 0);
      }
      if (event.target.closest && event.target.closest('#wofast-form')) updateFastWorkOrderTotal();
      if (event.target.id === 'workorder-date-use-to') {
        var toInput = document.getElementById('workorder-date-to-input');
        if (toInput) toInput.hidden = !event.target.checked;
      }
      if (event.target.name === 'wo-date-filter-mode') updateWorkOrderDateModeMenu();
      if (event.target.id === 'invoice-search') loadInvoices();
      if (event.target.id === 'invoice-status-filter') loadInvoices();
      if (event.target.id === 'invoice-date-use-to') {
        var invoiceToInput = document.getElementById('invoice-date-to-input');
        if (invoiceToInput) invoiceToInput.hidden = !event.target.checked;
      }
      if (event.target.name === 'invoice-date-filter-mode') updateInvoiceDateModeMenu();
      if (event.target.id === 'payment-search') loadPayments();
      if (event.target.id === 'item-search' || event.target.id === 'item-category-filter' || event.target.id === 'item-type-filter' || event.target.id === 'item-status-filter') loadItems();
      if (event.target.id === 'stock-search') loadStock();
      if (event.target.id === 'supplier-search') loadSuppliers();
      if (event.target.id === 'purchase-search') loadPurchases();
    }

    function bindAiChat() {
      var form = document.getElementById('ai-chat-form');
      if (!form || form.getAttribute('data-bound') === '1') return;
      form.setAttribute('data-bound', '1');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        sendAiChatMessage();
      });
    }

    var pendingAiActions = {};
    var aiChatHistory = [];
    var WORK_ORDER_PRESETS = {
      ANTI_KUMAN: 'Paket Cuci Antikuman\n- Cuci AC Mobil\n- Vacuum kabin\n- Isi Freon\n- Oli compressor',
      REFRESH_AC: 'Paket Refresh AC\n- Cuci AC Mobil\n- Isi Freon\n- Flushing',
      EVAPORATOR: 'Paket Ganti Evaporator\n- Jasa bongkar pasang evaporator\n- Evaporator',
      KELISTRIKAN: 'Servis Kelistrikan\n- Check wiring\n- Perbaikan soket',
      FILTER_KABIN: 'Ganti Filter Kabin\n- Filter Cabin',
      MOTOR_FAN: 'Motor Fan x2'
    };

    function dateInputValue(value) {
      if (!value) return todayValue();
      var date = new Date(value);
      if (isNaN(date.getTime())) return todayValue();
      var local = new Date(date.getTime() - (date.getTimezoneOffset() * 60000));
      return local.toISOString().slice(0, 10);
    }

    function workOrderPresetButtons() {
      return Object.keys(WORK_ORDER_PRESETS).map(function (key) {
        return '<button type="button" class="button workorder-preset" data-workorder-preset="' + key + '">' + escapeHtml(WORK_ORDER_PRESETS[key].split('\n')[0]) + '</button>';
      }).join('');
    }

    function appendWorkOrderPreset(key) {
      var field = document.getElementById('workorder-items');
      if (!field) return;
      var preset = WORK_ORDER_PRESETS[key];
      if (!preset) return;
      var current = String(field.value || '').trim();
      field.value = current ? (current + '\n\n' + preset) : preset;
      field.focus();
      field.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function appendAiMessage(role, text, action) {
      var thread = document.getElementById('ai-thread');
      if (!thread) return;
      var label = role === 'user' ? 'Anda' : 'DACM AI';
      var className = role === 'user' ? 'ai-message ai-message-user' : 'ai-message ai-message-assistant';
      var actionHtml = '';
      if (action) {
        var actionId = 'ai_action_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        pendingAiActions[actionId] = action;
        actionHtml = '<div class="ai-action-card"><p><strong>Draft aksi:</strong> ' + escapeHtml(action.label || action.type) + '</p><pre>' + escapeHtml(JSON.stringify(action.data || {}, null, 2)) + '</pre><button type="button" class="button primary" data-ai-execute="' + actionId + '">Jalankan Perintah</button></div>';
      }
      thread.insertAdjacentHTML('beforeend', '<div class="' + className + '"><strong>' + label + '</strong><p>' + escapeHtml(text) + '</p>' + actionHtml + '</div>');
      thread.scrollTop = thread.scrollHeight;
    }

    function rememberAiMessage(role, text) {
      aiChatHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: String(text || '') });
      if (aiChatHistory.length > 10) aiChatHistory = aiChatHistory.slice(aiChatHistory.length - 10);
    }

    function sendAiChatMessage() {
      var input = document.getElementById('ai-chat-input');
      if (!input) return;
      var message = String(input.value || '').trim();
      if (!message) return;
      input.value = '';
      appendAiMessage('user', message);
      rememberAiMessage('user', message);
      appendAiMessage('assistant', 'Memproses...');
      google.script.run.withSuccessHandler(function (result) {
        var thread = document.getElementById('ai-thread');
        var loading = thread ? thread.lastElementChild : null;
        if (loading && loading.className.indexOf('ai-message-assistant') >= 0) loading.remove();
        appendAiMessage('assistant', result.reply, result.action);
        rememberAiMessage('assistant', result.reply + (result.action ? '\nDraft aksi: ' + JSON.stringify(result.action) : ''));
      }).withFailureHandler(function (error) {
        var thread = document.getElementById('ai-thread');
        var loading = thread ? thread.lastElementChild : null;
        if (loading && loading.className.indexOf('ai-message-assistant') >= 0) loading.remove();
        appendAiMessage('assistant', (error && error.message) || error || 'Gagal memproses AI.');
      }).aiChat({ message: message, history: aiChatHistory.slice(0, aiChatHistory.length - 1) });
    }

    function executeAiAction(actionId, button) {
      var action = pendingAiActions[actionId];
      if (!action) return;
      if (!confirm('Jalankan perintah AI ini dan simpan/update data ERP?')) return;
      if (button) { button.disabled = true; button.textContent = 'Menjalankan...'; }
      google.script.run.withSuccessHandler(function (result) {
        delete pendingAiActions[actionId];
        appendAiMessage('assistant', (result && result.message) || 'Perintah berhasil dijalankan.');
        loadDashboard();
      }).withFailureHandler(function (error) {
        if (button) { button.disabled = false; button.textContent = 'Jalankan Perintah'; }
        appendAiMessage('assistant', (error && error.message) || error || 'Perintah gagal dijalankan.');
      }).aiExecuteAction(action);
    }

    function openView(view) {
      Array.prototype.forEach.call(document.querySelectorAll('.view'), function (el) { el.hidden = el.id !== view + '-view'; });
      Array.prototype.forEach.call(document.querySelectorAll('.nav-item[data-view]'), function (el) { el.classList.toggle('active', el.getAttribute('data-view') === view); });
      document.getElementById('page-title').textContent = ({ dashboard:'Dashboard', customers:'Pelanggan', vehicles:'Kendaraan', workorder:'Work Order', wofast:'WO Cepat', invoice:'Invoice', payment:'Pembayaran', items:'Stok Barang', stock:'Stok', suppliers:'Supplier', purchase:'Pembelian', ai:'Chat AI' })[view] || 'DACM ERP';
      document.getElementById('sidebar').classList.remove('open');
      if (view === 'customers') loadCustomers();
      if (view === 'vehicles') { populateVehicleFilters(); loadVehicles(); }
      if (view === 'workorder') { populateWorkOrderCustomerFilter(); loadWorkOrders('list'); }
      if (view === 'wofast') renderFastWorkOrder();
      if (view === 'invoice') loadInvoices();
      if (view === 'payment') loadPayments();
      if (view === 'items') loadItems();
      if (view === 'stock') loadStock();
      if (view === 'suppliers') loadSuppliers();
      if (view === 'purchase') loadPurchases();
      if (view === 'ai') bindAiChat();
    }

    function loadDashboard() {
      google.script.run.withSuccessHandler(function (data) {
        document.getElementById('dashboard-status').hidden = true;
        document.getElementById('stat-grid').innerHTML = data.metrics.map(function (item) {
          return '<article class="stat-card"><p>' + escapeHtml(item.label) + '</p><strong>' + escapeHtml(item.value) + '</strong></article>';
        }).join('');
        document.getElementById('stat-grid').hidden = false;
        document.getElementById('recent-workorders').innerHTML = data.recentWorkOrders.length ? data.recentWorkOrders.map(function (item) {
          return '<tr><td data-label="No. WO">' + escapeHtml(item.WorkOrderNo) + '</td><td data-label="Tanggal">' + escapeHtml(item.StartDate) + '</td><td data-label="Customer">' + escapeHtml(item.CustomerName) + '</td><td data-label="Kendaraan">' + escapeHtml(item.PlateNumber) + '</td><td data-label="Keluhan">' + escapeHtml(item.Complaint) + '</td><td data-label="Status"><span class="status">' + escapeHtml(item.Status) + '</span></td></tr>';
        }).join('') : '<tr><td colspan="6" class="muted">Belum ada Work Order.</td></tr>';
        document.getElementById('recent-panel').hidden = false;
      }).withFailureHandler(failure).getDashboardSummary();
    }

    function editCustomer(record) {
      var wrap = document.getElementById('customer-form-wrap');
      wrap.innerHTML = '<form id="customer-form" class="record-form"><input type="hidden" name="CustomerID" value="' + escapeHtml(record.CustomerID || '') + '"><div><label>Nama pelanggan</label><input name="CustomerName" required value="' + escapeHtml(record.CustomerName || '') + '"></div><div><label>Telepon</label><input name="Phone" value="' + escapeHtml(record.Phone || '') + '"></div><div><label>WhatsApp</label><input name="WhatsApp" value="' + escapeHtml(record.WhatsApp || '') + '"></div><div><label>Alamat</label><input name="Address" value="' + escapeHtml(record.Address || '') + '"></div><div class="actions"><button class="button primary">Simpan</button><button type="button" class="button secondary" data-cancel>Batalkan</button></div></form>';
      openCustomerFormTab(record);
      document.getElementById('customer-form').addEventListener('submit', function (event) {
        event.preventDefault();
        google.script.run.withSuccessHandler(function () { closeCustomerFormTab(); loadCustomers(); }).withFailureHandler(failure).customerSave(formData(event.target));
      });
    }

    function loadCustomers() {
      var filter = {
        search: (document.getElementById('customer-search') || {}).value || '',
        nonActive: (document.getElementById('customer-nonactive-filter') || {}).value || 'ALL',
        category: (document.getElementById('customer-category-filter') || {}).value || ''
      };
      google.script.run.withSuccessHandler(function (rows) {
        document.getElementById('customer-count').textContent = rows.length + ' pelanggan';
        document.getElementById('customer-table').innerHTML = rows.length ? rows.map(function (row) {
          var actions = '<button class="row-action row-action-icon" title="Edit" aria-label="Edit" data-customer="' + escapeHtml(row.CustomerID) + '">&#9998;</button> <button class="row-action row-action-icon row-action-danger" title="Hapus" aria-label="Hapus" data-customer-delete="' + escapeHtml(row.CustomerID) + '">&#128465;</button>';
          return '<tr><td data-label="ID">' + escapeHtml(row.CustomerID) + '</td><td data-label="Nama">' + escapeHtml(row.CustomerName) + '</td><td data-label="Telepon">' + escapeHtml(row.Phone) + '</td><td data-label="WhatsApp">' + escapeHtml(row.WhatsApp) + '</td><td data-label="Alamat">' + escapeHtml(row.Address) + '</td><td data-label="Aksi">' + actions + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="muted">Belum ada pelanggan.</td></tr>';
      }).withFailureHandler(failure).customerList(filter);
    }

    function deleteCustomer(customerId) {
      if (!confirm('Hapus pelanggan ' + customerId + ' secara permanen?')) return;
      google.script.run.withSuccessHandler(function () {
        loadCustomers();
        populateVehicleFilters(true);
        populateWorkOrderCustomerFilter(true);
        loadDashboard();
      }).withFailureHandler(failure).customerDelete(customerId);
    }

    function showCustomerTab(tabName) {
      var listPanel = document.getElementById('customer-list-panel');
      var formPanel = document.getElementById('customer-form-wrap');
      var formTab = document.getElementById('customer-form-tab');
      if (!listPanel || !formPanel) return;
      var showForm = tabName === 'form' && formTab && !formTab.hidden;
      listPanel.hidden = showForm;
      formPanel.hidden = !showForm;
      Array.prototype.forEach.call(document.querySelectorAll('[data-customer-tabs] .module-tab'), function (tab) {
        tab.classList.toggle('active', (tab.getAttribute('data-customer-tab') === 'form') === showForm);
      });
    }

    function openCustomerFormTab(record) {
      var formTab = document.getElementById('customer-form-tab');
      if (formTab) {
        formTab.innerHTML = escapeHtml(record && record.CustomerID ? 'Edit ' + record.CustomerID : 'Data Baru') + ' <span data-customer-close-form>×</span>';
        formTab.hidden = false;
      }
      showCustomerTab('form');
    }

    function closeCustomerFormTab() {
      var formTab = document.getElementById('customer-form-tab');
      var formPanel = document.getElementById('customer-form-wrap');
      if (formTab) formTab.hidden = true;
      if (formPanel) formPanel.innerHTML = '';
      showCustomerTab('list');
    }

    function showVehicleTab(tabName) {

    function updateFastWorkOrderTotal() {
      var form = document.getElementById('wofast-form');
      if (!form) return;
      var total = 0;
      var lines = [];
      Array.prototype.forEach.call(form.querySelectorAll('[data-fast-line]'), function (line) {
        var check = line.querySelector('[data-fast-check]');
        var price = line.querySelector('[data-fast-price]');
        var checked = check && check.checked;
        line.classList.toggle('active', !!checked);
        if (price) {
          price.disabled = !checked;
          if (!checked) price.value = '';
        }
        if (!checked) return;
        var name = check.getAttribute('data-fast-name') || '';
        var amount = Number(price ? cleanNumber(price.value) : 0) || 0;
        total += amount;
        lines.push(name + (amount ? ' - ' + rupiah(amount) : ''));
      });
      var totalRaw = document.getElementById('wofast-total-raw');
      var totalText = document.getElementById('wofast-total');
      var recommendation = document.getElementById('wofast-recommendation');
      if (totalRaw) totalRaw.value = total;
      if (totalText) totalText.textContent = rupiah(total);
      if (recommendation) recommendation.value = lines.join('; ');
    }

    function bindWorkOrderLookup(payload, selectedVehicleId) {
      var customerInput = document.getElementById('workorder-customer-search');
      var vehicleInput = document.getElementById('workorder-vehicle-search');
      customerInput.addEventListener('input', function () {
        applyCustomerLookup(payload);
        refreshVehicleDatalist(payload, '');
      });
      vehicleInput.addEventListener('input', function () { applyVehicleLookup(payload); });
      applyCustomerLookup(payload);
      refreshVehicleDatalist(payload, selectedVehicleId);
      applyVehicleLookup(payload);
    }

    function applyCustomerLookup(payload) {
      var value = String(document.getElementById('workorder-customer-search').value || '').trim().toLowerCase();
      var found = payload.customers.filter(function (c) {
        return (String(c.CustomerName || '') + ' - ' + String(c.Phone || c.WhatsApp || '-')).toLowerCase() === value;
      })[0];
      document.getElementById('workorder-customer-id').value = found ? found.CustomerID : '';
    }

    function refreshVehicleDatalist(payload, selectedVehicleId) {
      var customerId = document.getElementById('workorder-customer-id').value;
      var list = document.getElementById('workorder-vehicle-list');
      var vehicles = payload.vehicles.filter(function (v) { return !customerId || v.CustomerID === customerId; });
      list.innerHTML = vehicles.map(function (v) {
        return '<option value="' + escapeHtml(String(v.PlateNumber || '') + ' - ' + String(v.Brand || '') + ' ' + String(v.Model || '')) + '"></option>';
      }).join('');
      if (!selectedVehicleId) {
        document.getElementById('workorder-vehicle-id').value = '';
      }
    }

    function customerLookupLabel(customer) {
      return String(customer.CustomerName || '') + ' - ' + String(customer.Phone || customer.WhatsApp || '-');
    }

    function vehicleLookupLabel(vehicle) {
      return String(vehicle.PlateNumber || '') + ' - ' + String(vehicle.Brand || '') + ' ' + String(vehicle.Model || '');
    }

    function selectExistingVehicleInWorkOrder(payload, vehicle, message) {
      var customer = payload.customers.filter(function (c) { return c.CustomerID === vehicle.CustomerID; })[0];
      if (customer) {
        document.getElementById('workorder-customer-search').value = customerLookupLabel(customer);
        document.getElementById('workorder-customer-id').value = customer.CustomerID;
      }
      refreshVehicleDatalist(payload, vehicle.VehicleID);
      document.getElementById('workorder-vehicle-search').value = vehicleLookupLabel(vehicle);
      document.getElementById('workorder-vehicle-id').value = vehicle.VehicleID;
      var box = document.getElementById('workorder-inline-master-wrap');
      if (box) box.innerHTML = '<div class="inline-master-success">' + escapeHtml(message || 'Kendaraan existing sudah dipilih.') + '</div>';
    }

    function applyVehicleLookup(payload) {
      var customerId = document.getElementById('workorder-customer-id').value;
      var value = String(document.getElementById('workorder-vehicle-search').value || '').trim().toLowerCase();
      var found = payload.vehicles.filter(function (v) {
        var sameCustomer = !customerId || v.CustomerID === customerId;
        var label = (String(v.PlateNumber || '') + ' - ' + String(v.Brand || '') + ' ' + String(v.Model || '')).toLowerCase();
        return sameCustomer && label === value;
      })[0];
      document.getElementById('workorder-vehicle-id').value = found ? found.VehicleID : '';
    }

    function applyWorkOrderLookup(payload) {
      applyCustomerLookup(payload);
      applyVehicleLookup(payload);
    }

    function uniqueLookupOptions(options) {
      var seen = {};
      return options.filter(function (option) {
        var key = String(option.label || '').trim().toLowerCase().replace(/\s+/g, ' ');
        if (!key || seen[key]) return false;
        seen[key] = true;
        return true;
      });
    }

    function markWorkOrderFormSections() {
      var box = document.getElementById('workorder-inline-master-wrap');

      var vehicleRow = vehicleInput ? vehicleInput.closest('.lookup-row') : null;
      var vehicleTitle = vehicleRow ? vehicleRow.previousElementSibling : null;
      if (vehicleTitle) vehicleTitle.classList.add('wo-vehicle-section');
      if (vehicleRow) vehicleRow.classList.add('wo-vehicle-section');
      var node = box ? box.nextElementSibling : null;
      while (node) {
        node.classList.add('wo-after-inline-section');
        node = node.nextElementSibling;
      }
    }

    function setWorkOrderCustomerFocus(active) {

      form.classList.toggle('wo-customer-focus', !!active);

      var vehicleRow = vehicleInput ? vehicleInput.closest('.lookup-row') : null;
      var vehicleTitle = vehicleRow ? vehicleRow.previousElementSibling : null;

      var node = box.nextElementSibling;
      while (node) {
        node.hidden = !!active;
        node = node.nextElementSibling;
      }
    }

    function setWorkOrderVehicleFocus(active) {
      var form = document.getElementById('workorder-form');
      var box = document.getElementById('workorder-inline-master-wrap');
      if (!form || !box) return;
      form.classList.toggle('wo-vehicle-focus', !!active);
      var node = box.nextElementSibling;
      while (node) {
        node.hidden = !!active;
        node = node.nextElementSibling;
      }
    }

    function selectCustomerInWorkOrder(customer) {
      if (!customer) return;
      var box = document.getElementById('workorder-inline-master-wrap');
      var customerInput = document.getElementById('workorder-customer-search');
      var customerIdInput = document.getElementById('workorder-customer-id');
      var vehicleInput = document.getElementById('workorder-vehicle-search');
      var vehicleIdInput = document.getElementById('workorder-vehicle-id');
      var label = String(customer.CustomerName || '') + ' - ' + String(customer.Phone || customer.WhatsApp || '-');
      if (customerInput) customerInput.value = label;
      if (customerIdInput) customerIdInput.value = customer.CustomerID || '';
      if (vehicleInput) vehicleInput.value = '';
      if (vehicleIdInput) vehicleIdInput.value = '';
      if (box) box.innerHTML = '';
      setWorkOrderCustomerFocus(false);
      if (workOrderLookupPayload) refreshVehicleDatalist(workOrderLookupPayload, '');
      try {
        var customerListEl = document.getElementById('workorder-customer-list');
        var existingOptions = Array.prototype.slice.call(customerListEl.querySelectorAll('option'));
        var exists = existingOptions.some(function (option) { return String(option.value || '').trim().toLowerCase() === label.trim().toLowerCase(); });
        if (!exists) customerListEl.innerHTML += '<option value="' + escapeHtml(label) + '"></option>';
      } catch (ignore) {}
    }

        var name = (document.getElementById('wo-new-customer-name').value || '').trim();
        var phone = (document.getElementById('wo-new-customer-phone').value || '').trim();
        var address = (document.getElementById('wo-new-customer-address').value || '').trim();

        var model = (document.getElementById('wo-new-vehicle-model').value || '').trim();

        var timeoutId = setTimeout(function () {

          saveButton.disabled = false;
          saveButton.textContent = 'Simpan Kendaraan';
          alert('Simpan kendaraan belum mendapat respons dari server. Coba refresh lalu cek data kendaraan.');

            saveButton.disabled = false;

      var useTo = document.getElementById('invoice-date-use-to');

      var fromMode = document.querySelector('input[name="invoice-date-filter-mode"][value="FROM"]');
      var monthUnit = document.querySelector('input[name="invoice-date-unit"][value="MONTH"]');
      if (fromInput) fromInput.value = '';

      if (useTo) useTo.checked = false;
      if (duration) duration.value = 0;
      if (fromMode) fromMode.checked = true;
      if (monthUnit) monthUnit.checked = true;

    function applyInvoiceDateFilter() {
      var modeEl = document.querySelector('input[name="invoice-date-filter-mode"]:checked');
      var mode = modeEl ? modeEl.value : 'FROM';
      if (mode === 'LAST') {
        var duration = Number((document.getElementById('invoice-date-duration-input') || {}).value || 0);
        var unitEl = document.querySelector('input[name="invoice-date-unit"]:checked');
        var unit = unitEl ? unitEl.value : 'MONTH';
        if (!duration || duration < 1) { clearInvoiceDateFilter(); return; }
        var labelUnit = unit === 'DAY' ? 'Hari' : (unit === 'WEEK' ? 'Minggu' : 'Bulan');
        setInvoiceDateFilterState('LAST', '', '', duration, unit, 'Tanggal: ' + duration + ' ' + labelUnit + ' terakhir');
      } else {
        var from = (document.getElementById('invoice-date-from-input') || {}).value || '';
        var useTo = document.getElementById('invoice-date-use-to');
        var to = useTo && useTo.checked ? ((document.getElementById('invoice-date-to-input') || {}).value || '') : '';
        if (!from) { clearInvoiceDateFilter(); return; }
        setInvoiceDateFilterState(to ? 'RANGE' : 'FROM', from, to, '', 'MONTH', to ? ('Tanggal: ' + from + ' - ' + to) : ('Tanggal: dari ' + from));
      }
      var popover = document.getElementById('invoice-date-popover');
      if (popover) popover.hidden = true;
      loadInvoices();
    }

        document.getElementById('stock-count').textContent = rows.length + ' saldo stok';
        document.getElementById('stock-table').innerHTML = rows.length ? rows.map(function (row) {
          return '<tr><td>' + escapeHtml(row.ItemName) + '</td><td>' + escapeHtml(row.Branch) + '</td><td>' + escapeHtml(row.Quantity) + '</td><td>' + escapeHtml(row.Unit) + '</td><td>' + escapeHtml(row.MinimumStock) + '</td><td><span class="status">' + (row.LowStock ? 'STOK RENDAH' : 'AMAN') + '</span></td></tr>';
        }).join('') : '<tr><td colspan="6" class="muted">Belum ada saldo stok.</td></tr>';
      }).withFailureHandler(failure).stockList(document.getElementById('stock-search').value);
    }

    function editSupplier(record) {
      var wrap = document.getElementById('supplier-form-wrap');
      wrap.innerHTML = '<form id="supplier-form" class="record-form"><input type="hidden" name="SupplierID" value="' + escapeHtml(record.SupplierID || '') + '"><div><label>Nama supplier</label><input name="SupplierName" required value="' + escapeHtml(record.SupplierName || '') + '"></div><div><label>Telepon</label><input name="Phone" value="' + escapeHtml(record.Phone || '') + '"></div><div><label>Kontak</label><input name="ContactPerson" value="' + escapeHtml(record.ContactPerson || '') + '"></div><div><label>Status</label><select name="Status"><option value="ACTIVE"' + (record.Status === 'INACTIVE' ? '' : ' selected') + '>ACTIVE</option><option value="INACTIVE"' + (record.Status === 'INACTIVE' ? ' selected' : '') + '>INACTIVE</option></select></div><div class="wide"><label>Alamat</label><input name="Address" value="' + escapeHtml(record.Address || '') + '"></div><div class="actions"><button class="button primary">Simpan Supplier</button><button type="button" class="button secondary" data-cancel>Batalkan</button></div></form>';
      wrap.hidden = false;
      document.getElementById('supplier-form').addEventListener('submit', function (event) {
        event.preventDefault();
        google.script.run.withSuccessHandler(function () { wrap.hidden = true; loadSuppliers(); }).withFailureHandler(failure).supplierSave(formData(event.target));
      });
    }

    function loadSuppliers() {
      google.script.run.withSuccessHandler(function (rows) {
        document.getElementById('supplier-count').textContent = rows.length + ' supplier';
        document.getElementById('supplier-table').innerHTML = rows.length ? rows.map(function (row) {
          return '<tr><td>' + escapeHtml(row.SupplierID) + '</td><td>' + escapeHtml(row.SupplierName) + '</td><td>' + escapeHtml(row.Phone) + '</td><td>' + escapeHtml(row.ContactPerson) + '</td><td><span class="status">' + escapeHtml(row.Status) + '</span></td><td><button class="row-action" data-supplier="' + escapeHtml(row.SupplierID) + '">Ubah</button></td></tr>';
        }).join('') : '<tr><td colspan="6" class="muted">Belum ada supplier.</td></tr>';
      }).withFailureHandler(failure).supplierList(document.getElementById('supplier-search').value);
    }

    function editPurchase() {
      google.script.run.withSuccessHandler(function (payload) {
        var supplierOptions = '<option value="">Pilih supplier</option>' + payload.suppliers.filter(function (supplier) { return supplier.Status === 'ACTIVE'; }).map(function (supplier) { return '<option value="' + escapeHtml(supplier.SupplierID) + '">' + escapeHtml(supplier.SupplierName) + '</option>'; }).join('');
        var itemOptions = '<option value="">Pilih item</option>' + payload.items.filter(function (item) { return item.Status === 'ACTIVE'; }).map(function (item) { return '<option value="' + escapeHtml(item.ItemCode) + '">' + escapeHtml(item.ItemName + ' (' + item.Unit + ')') + '</option>'; }).join('');
        var wrap = document.getElementById('purchase-form-wrap');
        wrap.innerHTML = '<form id="purchase-form" class="record-form"><div><label>Tanggal pembelian</label><input name="PurchaseDate" type="date" required value="' + todayValue() + '"></div><div><label>Supplier</label><select name="SupplierID" required>' + supplierOptions + '</select></div><div><label>Item</label><select name="ItemCode" required>' + itemOptions + '</select></div><div><label>Cabang/Gudang</label><input name="Branch" required value="D"></div><div><label>Jumlah diterima</label><input name="Quantity" type="number" min="1" required></div><div><label>Harga beli satuan</label><input name="UnitCost" type="number" min="0" value="0"></div><div><label>Stok minimum</label><input name="MinimumStock" type="number" min="0" value="0"></div><div class="wide"><label>Catatan</label><input name="Notes" placeholder="Opsional"></div><div class="actions"><button class="button primary">Terima Barang</button><button type="button" class="button secondary" data-cancel>Batalkan</button></div></form>';
        wrap.hidden = false;
        document.getElementById('purchase-form').addEventListener('submit', function (event) {
          event.preventDefault();
          google.script.run.withSuccessHandler(function () { wrap.hidden = true; loadPurchases(); loadStock(); loadDashboard(); }).withFailureHandler(failure).purchaseReceive(formData(event.target));
        });
      }).withFailureHandler(failure).purchaseFormOptions();
    }

    function loadPurchases() {
      google.script.run.withSuccessHandler(function (rows) {
        document.getElementById('purchase-count').textContent = rows.length + ' pembelian';
        document.getElementById('purchase-table').innerHTML = rows.length ? rows.map(function (row) {
          return '<tr><td>' + escapeHtml(row.PurchaseNo) + '</td><td>' + escapeHtml(row.PurchaseDateText) + '</td><td>' + escapeHtml(row.SupplierName) + '</td><td>' + escapeHtml(row.ItemName) + '</td><td>' + escapeHtml(row.Quantity + ' ' + row.Unit) + '</td><td>' + rupiah(row.TotalCost) + '</td><td><span class="status">' + escapeHtml(row.Status) + '</span></td></tr>';
        }).join('') : '<tr><td colspan="7" class="muted">Belum ada pembelian.</td></tr>';
      }).withFailureHandler(failure).purchaseList(document.getElementById('purchase-search').value);
    }

    try {
      var cachedUser = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      if (cachedUser && cachedUser.success) showDashboard(cachedUser);
      else bindLogin();
    } catch (error) {
      sessionStorage.removeItem(SESSION_KEY);
      bindLogin();
    }
  })();
</script>
